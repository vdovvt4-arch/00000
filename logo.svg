  </defs>
  <rect width="120" height="120" rx="28" fill="url(#bgGrad)"/>
  <circle cx="60" cy="60" r="50" fill="none" stroke="url(#accentGrad)" stroke-width="3.2"/>
  <circle cx="60" cy="60" r="43" fill="none" stroke="#38bdf8" stroke-opacity=".22" stroke-width="1.2"/>
  <g fill="url(#accentGrad)">
    <rect x="39" y="54" width="42" height="7" rx="3"/>
    <rect x="29" y="38" width="9" height="39" rx="3.5"/>
    <rect x="19" y="45" width="7" height="25" rx="3"/>
    <rect x="82" y="38" width="9" height="39" rx="3.5"/>
    <rect x="94" y="45" width="7" height="25" rx="3"/>
  </g>
  <text x="60" y="96" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="16" font-weight="900" letter-spacing="3">POWER GYM</text>
</svg>