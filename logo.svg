  <circle cx="180" cy="180" r="132" fill="none" stroke="#facc15" stroke-opacity=".16" stroke-width="2"/>
  <rect x="56" y="108" width="22" height="144" rx="7" fill="url(#gold)" stroke="#fff0a3" stroke-width="3"/>
  <rect x="84" y="88" width="28" height="184" rx="8" fill="url(#gold)" stroke="#fff0a3" stroke-width="3"/>
  <rect x="248" y="88" width="28" height="184" rx="8" fill="url(#gold)" stroke="#fff0a3" stroke-width="3"/>
  <rect x="282" y="108" width="22" height="144" rx="7" fill="url(#gold)" stroke="#fff0a3" stroke-width="3"/>
  <path d="M70 166h220v28H70z" fill="url(#gold)" filter="url(#glow)"/>
  <path d="M115 69h130" fill="none" stroke="#facc15" stroke-linecap="round" stroke-opacity=".45" stroke-width="4"/>
  <text x="180" y="164" text-anchor="middle" fill="#fff0a3" stroke="#090a08" stroke-width="7" paint-order="stroke" font-family="Arial,sans-serif" font-size="94" font-weight="900" letter-spacing="-8">PG</text>
  <text x="180" y="232" text-anchor="middle" fill="#facc15" font-family="Arial,sans-serif" font-size="28" font-weight="900" letter-spacing="9">POWER GYM</text>
