<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>متجر القاعة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f8fafc; --brand:#0891b2; --brand-dark:#0e7490; --sale:#e11d48; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; }
    header { background: #fff; border-bottom: 1px solid var(--line); padding: 22px 16px 18px; text-align: center; position: sticky; top: 0; z-index: 5; }
    header h1 { font-size: 22px; font-weight: 800; }
    header p { margin-top: 4px; font-size: 13px; color: var(--muted); max-width: 520px; margin-inline: auto; line-height: 1.7; }
    main { max-width: 960px; margin: 0 auto; padding: 18px 14px 60px; }
    .search { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; font: inherit; font-size: 16px; background: #fff; margin-bottom: 16px; }
    .search:focus { outline: 2px solid var(--brand); border-color: transparent; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 16px; } }
    @media (min-width: 900px) { .grid { grid-template-columns: repeat(4, 1fr); } }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
    .thumb { position: relative; aspect-ratio: 1 / 1; background: #f1f5f9; display: flex; align-items: center; justify-content: center; color: #cbd5e1; font-size: 40px; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .badge { position: absolute; top: 8px; right: 8px; background: var(--sale); color: #fff; font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 999px; }
    .soldout { position: absolute; inset: 0; background: rgba(255,255,255,.7); display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--muted); }
    .info { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .name { font-size: 14px; font-weight: 700; line-height: 1.5; }
    .desc { font-size: 12px; color: var(--muted); line-height: 1.7; white-space: pre-line; }
    .price { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 4px; }
    .now { font-size: 16px; font-weight: 800; color: var(--ink); }
    .old { font-size: 12px; color: var(--muted); text-decoration: line-through; }
    .btn { border: 0; cursor: pointer; font: inherit; font-weight: 700; font-size: 14px; border-radius: 12px; padding: 10px 14px; background: var(--brand); color: #fff; transition: background .15s; }
    .btn:hover { background: var(--brand-dark); }
    .btn:disabled { background: #cbd5e1; cursor: not-allowed; }
    .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    .empty { text-align: center; color: var(--muted); padding: 60px 10px; font-size: 15px; }
    .overlay { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none; align-items: flex-end; justify-content: center; z-index: 20; }
    .overlay.show { display: flex; }
    .sheet { background: #fff; width: 100%; max-width: 480px; border-radius: 22px 22px 0 0; padding: 20px 18px 24px; max-height: 92vh; overflow-y: auto; }
    @media (min-width: 640px) { .overlay { align-items: center; } .sheet { border-radius: 22px; } }
    .sheet h2 { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
    .sheet .sub { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 5px; }
    .field input, .field textarea { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; font: inherit; font-size: 16px; }
    .field input:focus, .field textarea:focus { outline: 2px solid var(--brand); border-color: transparent; }
    .qty { display: flex; align-items: center; gap: 12px; }
    .qty button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-size: 20px; cursor: pointer; }
    .qty span { min-width: 30px; text-align: center; font-weight: 800; font-size: 16px; }
    .row { display: flex; gap: 10px; margin-top: 6px; }
    .row .btn { flex: 1; }
    .error { background: #fef2f2; color: #b91c1c; border-radius: 10px; padding: 9px 12px; font-size: 13px; margin-bottom: 10px; display: none; }
    .ok { text-align: center; padding: 14px 4px 4px; }
    .ok .tick { font-size: 46px; }
    .ok h3 { font-size: 18px; margin: 8px 0 6px; }
    .ok p { color: var(--muted); font-size: 13px; line-height: 1.8; margin-bottom: 14px; }
    footer { text-align: center; color: #94a3b8; font-size: 12px; padding: 20px; }
  </style>
</head>
<body>
  <header>
    <h1 id="storeTitle">متجر القاعة</h1>
    <p id="storeNote"></p>
  </header>
  <main>
    <input id="search" class="search" type="search" placeholder="ابحث عن منتج...">
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" style="display:none"></div>
  </main>
  <footer>الحجز مجاني، وتدفع عند الاستلام من القاعة</footer>

  <div id="overlay" class="overlay">
    <div class="sheet" id="sheet"></div>
  </div>
  <script src="store.js"></script>
</body>
</html>
