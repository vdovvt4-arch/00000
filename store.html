<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co wss://*.supabase.co;">
  <meta name="theme-color" content="#020617">
  <title>متجر القاعة | Power Gym</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#ffffff; --card:#ffffff; --brand:#f59e0b; --brand-dark:#d97706; --sale:#e11d48; }
    body.theme-soft { --bg:#f1f5f9; --card:#ffffff; }
    body.theme-dark { --ink:#f8fafc; --muted:#94a3b8; --line:#1e293b; --bg:#020617; --card:#0f172a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; transition: background .2s, color .2s; }
    header { background: var(--card); border-bottom: 1px solid var(--line); padding: 12px 16px 14px; text-align: center; position: sticky; top: 0; z-index: 10; }
    .header-top { max-width: 980px; margin: 0 auto 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .server-badge { font-size: 11px; font-weight: 800; color: #10b981; background: rgba(16,185,129,.12); border: 1px solid rgba(16,185,129,.3); padding: 4px 10px; border-radius: 999px; }
    .auth-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .google-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 12px; font-weight: 800; padding: 5px 12px; border-radius: 999px; cursor: pointer; }
    .google-btn:hover { filter: brightness(0.96); }
    .user-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 10px 3px 4px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); }
    .user-chip img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }
    .promo-wrap { display: none; position: relative; overflow: hidden; border-radius: 18px; margin-bottom: 14px; border: 1px solid rgba(245,158,11,.35); background: linear-gradient(135deg, #18181b 0%, #09090b 100%); color: #fff; box-shadow: 0 12px 30px rgba(0,0,0,.22); }
    .promo-wrap.show { display: block; }
    .promo-track { display: flex; transition: transform .55s cubic-bezier(.22,1,.36,1); }
    .promo-slide { min-width: 100%; padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; position: relative; }
    .promo-badge { display: inline-block; font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 999px; margin-bottom: 6px; color: #fff; }
    .promo-title { font-size: 16px; font-weight: 800; line-height: 1.5; }
    .promo-sub { font-size: 12px; opacity: .85; margin-top: 2px; }
    .promo-controls { display: flex; align-items: center; justify-content: space-between; padding: 0 14px 10px; gap: 8px; }
    .promo-dots { display: flex; gap: 6px; align-items: center; }
    .promo-dot { width: 8px; height: 8px; border-radius: 999px; border: 0; background: rgba(255,255,255,.3); cursor: pointer; transition: all .25s; }
    .promo-dot.active { width: 22px; background: #fbbf24; }
    .promo-nav { display: flex; gap: 6px; }
    .promo-nav button { width: 28px; height: 28px; border-radius: 999px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); color: #fff; cursor: pointer; font-size: 13px; }
    header h1 { font-size: 22px; font-weight: 900; }
    header p { margin-top: 4px; font-size: 13px; color: var(--muted); max-width: 560px; margin-inline: auto; line-height: 1.7; }
    .closed-banner { display:none; background:#fef2f2; color:#b91c1c; border-bottom:1px solid #fecaca; padding:10px 14px; text-align:center; font-size:13px; font-weight:700; }
    main { max-width: 980px; margin: 0 auto; padding: 18px 14px 60px; }
    .search { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; font: inherit; font-size: 16px; background: var(--card); color: var(--ink); margin-bottom: 12px; }
    .search:focus { outline: 2px solid var(--brand); border-color: transparent; }
    .cats { display: none; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .cat-pill { border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 999px; cursor: pointer; }
    .cat-pill.active { background: var(--brand); color: #09090b; border-color: var(--brand); font-weight: 900; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 16px; } }
    @media (min-width: 900px) { .grid { grid-template-columns: repeat(4, 1fr); } }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
    .thumb { position: relative; aspect-ratio: 1 / 1; background: #f1f5f9; display: flex; align-items: center; justify-content: center; color: #cbd5e1; font-size: 40px; }
    body.theme-dark .thumb { background: #1e293b; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .badge { position: absolute; top: 8px; right: 8px; background: var(--sale); color: #fff; font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 999px; }
    .cat-tag { position: absolute; bottom: 8px; right: 8px; background: rgba(15,23,42,.75); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
    .soldout { position: absolute; inset: 0; background: rgba(15,23,42,.72); display: flex; align-items: center; justify-content: center; font-weight: 800; color: #f8fafc; }
    .info { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .name { font-size: 14px; font-weight: 800; line-height: 1.5; }
    .desc { font-size: 12px; color: var(--muted); line-height: 1.7; white-space: pre-line; }
    .price { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 4px; }
    .now { font-size: 16px; font-weight: 900; color: var(--ink); }
    .old { font-size: 12px; color: var(--muted); text-decoration: line-through; }
    .btn { border: 0; cursor: pointer; font: inherit; font-weight: 800; font-size: 14px; border-radius: 12px; padding: 10px 14px; background: var(--brand); color: #09090b; transition: filter .15s; }
    .btn:hover { filter: brightness(1.08); }
    .btn:disabled { background: #94a3b8; color: #fff; cursor: not-allowed; }
    .btn.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
    .empty { text-align: center; color: var(--muted); padding: 60px 10px; font-size: 15px; }
    .overlay { position: fixed; inset: 0; background: rgba(15,23,42,.6); display: none; align-items: flex-end; justify-content: center; z-index: 20; }
    .overlay.show { display: flex; }
    .sheet { background: var(--card); color: var(--ink); width: 100%; max-width: 480px; border-radius: 22px 22px 0 0; padding: 20px 18px 24px; max-height: 92vh; overflow-y: auto; }
    @media (min-width: 640px) { .overlay { align-items: center; } .sheet { border-radius: 22px; } }
    .sheet h2 { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
    .sheet .sub { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 5px; }
    .field input, .field textarea { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; font: inherit; font-size: 16px; background: var(--bg); color: var(--ink); }
    .field input:focus, .field textarea:focus { outline: 2px solid var(--brand); border-color: transparent; }
    .qty { display: flex; align-items: center; gap: 12px; }
    .qty button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 20px; cursor: pointer; }
    .qty span { min-width: 30px; text-align: center; font-weight: 800; font-size: 16px; }
    .row { display: flex; gap: 10px; margin-top: 6px; }
    .row .btn { flex: 1; }
    .error { background: #fef2f2; color: #b91c1c; border-radius: 10px; padding: 9px 12px; font-size: 13px; margin-bottom: 10px; display: none; }
    .ok { text-align: center; padding: 14px 4px 4px; }
    .ok .tick { font-size: 46px; }
    .ok h3 { font-size: 18px; margin: 8px 0 6px; }
    .ok p { color: var(--muted); font-size: 13px; line-height: 1.8; margin-bottom: 14px; }
    .res-item { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
    .res-status { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: rgba(245,158,11,.15); color: #f59e0b; }
    footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; }
  </style>
</head>
<body class="theme-dark">
  <header>
    <div class="header-top">
      <span class="server-badge">● متصل بقاعدة البيانات</span>
      <div id="storeAuthBar" class="auth-bar"></div>
    </div>
    <h1 id="storeTitle">متجر Power Gym</h1>
    <p id="storeNote"></p>
  </header>
  <div id="closedBanner" class="closed-banner">المتجر متوقف مؤقتاً عن استقبال الحجوزات الجديدة</div>
  <main>
    <section id="promoBanner" class="promo-wrap" aria-label="لوحة الإعلانات والعروض"></section>
    <input id="search" class="search" type="search" placeholder="ابحث عن منتج أو مكمل غذائي...">
    <div id="catsBar" class="cats"></div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" style="display:none"></div>
  </main>
  <footer>الحجز مجاني، وتدفع عند الاستلام من القاعة</footer>

  <div id="overlay" class="overlay">
    <div class="sheet" id="sheet"></div>
  </div>
  <script src="js/vendor/supabase.min.js"></script>
  <script src="store.js"></script>
</body>
</html>
